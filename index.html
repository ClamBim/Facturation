/* ============================================================
   Atelier Pilotage — jetons de design
   Une seule source de verite pour couleurs, espacements, rayons.
   ============================================================ */

:root {
  color-scheme: light;

  /* Marque */
  --brand-900: #14211f;
  --brand-800: #1b2b28;
  --brand-700: #24302e;   /* barre laterale */
  --brand-600: #1d5249;
  --brand-500: #23645a;   /* accent principal */
  --brand-400: #2f7d70;
  --brand-100: #e8f3ee;
  --brand-050: #f2f8f5;

  /* Neutres */
  --ink-900: #11171a;
  --ink-800: #1f2528;     /* texte courant */
  --ink-600: #3f4a4f;
  --ink-500: #667075;     /* texte secondaire */
  --ink-400: #8b9499;
  --line-200: #e3e8e4;
  --line-100: #eef1ee;
  --surface: #ffffff;
  --surface-2: #f8faf7;
  --canvas: #f4f6f3;

  /* Etats */
  --ok-600: #1f7a4d;
  --ok-100: #e3f4ea;
  --warn-600: #9a6300;
  --warn-100: #fdf1dc;
  --danger-600: #b3261e;
  --danger-100: #fbe6e4;
  --info-600: #1f5f8b;
  --info-100: #e3eff8;

  /* Typographie */
  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", "Menlo", "Consolas", monospace;
  --fs-xs: 0.75rem;
  --fs-sm: 0.8125rem;
  --fs-md: 0.875rem;
  --fs-lg: 1rem;
  --fs-xl: 1.25rem;
  --fs-2xl: 1.5rem;

  /* Espacements */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-8: 32px;
  --sp-10: 40px;

  /* Formes */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-pill: 999px;

  --shadow-sm: 0 1px 2px rgba(17, 23, 26, 0.06);
  --shadow-md: 0 6px 18px rgba(17, 23, 26, 0.08);
  --shadow-lg: 0 24px 60px rgba(17, 23, 26, 0.18);

  --sidebar-w: 260px;
  --topbar-h: 68px;

  /* Series de donnees (graphiques) */
  --series-1: #23645a;
  --series-2: #c98a2e;
  --series-3: #4b7fb5;
  --series-4: #8a6bab;
  --series-5: #a8574a;
}

:root[data-theme="dark"] {
  color-scheme: dark;

  --brand-700: #16201f;
  --brand-500: #4aa392;
  --brand-400: #63b8a7;
  --brand-100: #1d3b36;
  --brand-050: #162926;

  --ink-900: #f5f8f6;
  --ink-800: #e7ecea;
  --ink-600: #c3ccc9;
  --ink-500: #97a3a0;
  --ink-400: #7c8784;
  --line-200: #2a3533;
  --line-100: #222c2b;
  --surface: #182220;
  --surface-2: #1d2927;
  --canvas: #111917;

  --ok-600: #59b982;
  --ok-100: #16301f;
  --warn-600: #d8a74a;
  --warn-100: #2f2512;
  --danger-600: #e8776d;
  --danger-100: #341917;
  --info-600: #6fa8d4;
  --info-100: #14242f;

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
  --shadow-md: 0 6px 18px rgba(0, 0, 0, 0.45);
  --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.55);
}


/* ============================================================
   Atelier Pilotage — socle : reset, mise en page, typographie
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; }

/* L attribut hidden prime sur tout mode d affichage declare par un composant. */
[hidden] { display: none !important; }

html, body { height: 100%; }

body {
  margin: 0;
  font-family: var(--font-sans);
  font-size: var(--fs-md);
  line-height: 1.5;
  color: var(--ink-800);
  background: var(--canvas);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4, p, figure { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--brand-500); }

:focus-visible {
  outline: 2px solid var(--brand-500);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

.skip-link {
  position: absolute;
  left: -999px;
  top: var(--sp-2);
  z-index: 100;
  padding: var(--sp-2) var(--sp-4);
  background: var(--surface);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-md);
}
.skip-link:focus { left: var(--sp-2); }

.visually-hidden {
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0);
  white-space: nowrap; border: 0;
}

/* ---------- Structure ---------- */

.app-shell {
  display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
  min-height: 100vh;
}

.main-column { display: flex; flex-direction: column; min-width: 0; }

/* ---------- Barre laterale ---------- */

.sidebar {
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
  padding: var(--sp-5) var(--sp-4);
  background: var(--brand-700);
  color: #f8fbf7;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.sidebar__title { font-size: var(--fs-xl); font-weight: 700; letter-spacing: -0.01em; }
.sidebar__subtitle { font-size: var(--fs-xs); color: rgba(248, 251, 247, 0.6); }

.sidebar__context { display: grid; gap: var(--sp-2); }
.sidebar__context .field__label { color: rgba(248, 251, 247, 0.6); }
.sidebar__context .input {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 255, 255, 0.14);
  color: #f8fbf7;
}
.sidebar__context .input option { color: var(--ink-800); }

.sidebar__user { font-size: var(--fs-xs); color: rgba(248, 251, 247, 0.6); }
.sidebar__user strong { display: block; font-size: var(--fs-md); color: #f8fbf7; font-weight: 600; }

.sidebar__nav { display: grid; gap: var(--sp-5); margin-top: var(--sp-1); }
.nav-group__title {
  font-size: var(--fs-xs);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: rgba(248, 251, 247, 0.45);
  padding: 0 var(--sp-2) var(--sp-2);
}
.nav-group__items { display: grid; gap: 2px; }

.nav-item {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  width: 100%;
  padding: var(--sp-2) var(--sp-3);
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: rgba(248, 251, 247, 0.74);
  font-size: var(--fs-md);
  text-align: left;
  text-decoration: none;
  cursor: pointer;
}
.nav-item:hover { background: rgba(255, 255, 255, 0.06); color: #fff; }
.nav-item[aria-current="page"] { background: var(--brand-500); color: #fff; font-weight: 600; }
.nav-item__icon { width: 18px; text-align: center; opacity: 0.85; font-size: var(--fs-md); }
.nav-item__count {
  margin-left: auto;
  font-size: var(--fs-xs);
  color: rgba(248, 251, 247, 0.55);
  font-variant-numeric: tabular-nums;
}
.nav-item[aria-current="page"] .nav-item__count { color: rgba(255, 255, 255, 0.85); }

.sidebar__footer { margin-top: auto; display: grid; gap: var(--sp-2); }
.sidebar__status { font-size: var(--fs-xs); color: rgba(248, 251, 247, 0.55); }
.sidebar__status[data-tone="error"] { color: #f0a9a2; }
.sidebar__status[data-tone="ok"] { color: #9fd9be; }
.sidebar .btn--ghost {
  background: rgba(255, 255, 255, 0.06);
  border-color: rgba(255, 255, 255, 0.12);
  color: #f8fbf7;
}

/* ---------- Barre superieure ---------- */

.topbar {
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  min-height: var(--topbar-h);
  padding: var(--sp-4) var(--sp-6);
  background: var(--canvas);
  position: sticky;
  top: 0;
  z-index: 20;
  border-bottom: 1px solid var(--line-200);
}
.topbar__heading { min-width: 0; }
.topbar h1 { font-size: var(--fs-2xl); font-weight: 700; letter-spacing: -0.02em; }
.topbar__subtitle { font-size: var(--fs-sm); color: var(--ink-500); }
.topbar__actions { margin-left: auto; display: flex; gap: var(--sp-2); flex-wrap: wrap; justify-content: flex-end; }
.topbar__burger { display: none; }

/* ---------- Contenu ---------- */

.content {
  padding: var(--sp-6);
  display: grid;
  gap: var(--sp-5);
  align-content: start;
}
.content:focus { outline: none; }

.loader {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-10);
  color: var(--ink-500);
  justify-content: center;
}
.spinner {
  width: 18px; height: 18px;
  border: 2px solid var(--line-200);
  border-top-color: var(--brand-500);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .spinner { animation-duration: 3s; }
  * { scroll-behavior: auto !important; }
}

/* ---------- Responsive ---------- */

@media (max-width: 1024px) {
  .app-shell { grid-template-columns: minmax(0, 1fr); }
  .sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    width: var(--sidebar-w);
    z-index: 40;
    transform: translateX(-100%);
    transition: transform 0.18s ease;
    box-shadow: var(--shadow-lg);
  }
  .app-shell[data-nav="open"] .sidebar { transform: translateX(0); }
  .topbar__burger { display: inline-flex; }
  .content { padding: var(--sp-4); }
  .topbar { padding: var(--sp-3) var(--sp-4); }
}

@media (max-width: 720px) {
  .topbar { flex-wrap: wrap; }
  .topbar__actions { margin-left: 0; width: 100%; justify-content: flex-start; }
  .topbar h1 { font-size: var(--fs-xl); }
}


/* ============================================================
   Atelier Pilotage — composants
   ============================================================ */

/* ---------- Boutons ---------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  padding: 8px 14px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: var(--brand-500);
  color: #fff;
  font-size: var(--fs-md);
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  text-decoration: none;
}
.btn:hover { background: var(--brand-400); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn--secondary { background: var(--surface); color: var(--ink-800); border-color: var(--line-200); }
.btn--secondary:hover { background: var(--surface-2); }
.btn--ghost { background: transparent; color: var(--ink-600); border-color: var(--line-200); }
.btn--ghost:hover { background: var(--surface-2); }
.btn--danger { background: var(--danger-600); }
.btn--danger:hover { background: #c8352c; }
.btn--sm { padding: 5px 10px; font-size: var(--fs-sm); }
.btn--block { width: 100%; }

.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px; height: 28px;
  border: 1px solid var(--line-200);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--ink-600);
  cursor: pointer;
  font-size: var(--fs-sm);
  line-height: 1;
}
.icon-btn:hover { background: var(--surface-2); color: var(--ink-900); border-color: var(--ink-400); }
.icon-btn--danger:hover { color: var(--danger-600); border-color: var(--danger-600); background: var(--danger-100); }

.actions-cell { display: flex; gap: 3px; flex-wrap: nowrap; }

/* ---------- Cartes ---------- */

.card {
  background: var(--surface);
  border: 1px solid var(--line-200);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.card__header {
  display: flex;
  align-items: flex-end;
  gap: var(--sp-4);
  padding: var(--sp-4) var(--sp-5);
  border-bottom: 1px solid var(--line-100);
}
.card__title { font-size: var(--fs-lg); font-weight: 600; }
.card__hint { font-size: var(--fs-sm); color: var(--ink-500); }
.card__header-actions { margin-left: auto; display: flex; gap: var(--sp-2); align-items: center; flex-wrap: wrap; }
.card__body { padding: var(--sp-5); display: grid; gap: var(--sp-4); }
.card__body--flush { padding: 0; }

/* ---------- Indicateurs ---------- */

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: var(--sp-4);
}
.kpi {
  background: var(--surface);
  border: 1px solid var(--line-200);
  border-radius: var(--radius-lg);
  padding: var(--sp-4) var(--sp-5);
  display: grid;
  gap: 2px;
  box-shadow: var(--shadow-sm);
}
.kpi__label { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-500); }
.kpi__value { font-size: var(--fs-2xl); font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.kpi__hint { font-size: var(--fs-sm); color: var(--ink-500); }
.kpi[data-tone="ok"] .kpi__value { color: var(--ok-600); }
.kpi[data-tone="warn"] .kpi__value { color: var(--warn-600); }
.kpi[data-tone="danger"] .kpi__value { color: var(--danger-600); }

/* ---------- Onglets / puces ---------- */

.chips { display: flex; gap: var(--sp-2); flex-wrap: wrap; }
.chip {
  padding: 6px 14px;
  border: 1px solid transparent;
  border-radius: var(--radius-pill);
  background: transparent;
  color: var(--ink-600);
  font-size: var(--fs-md);
  cursor: pointer;
}
.chip:hover { background: var(--surface-2); }
.chip[aria-pressed="true"] { background: var(--brand-100); color: var(--ink-900); font-weight: 600; }

/* ---------- Tableaux ---------- */

.table-toolbar {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-5);
  border-bottom: 1px solid var(--line-100);
  flex-wrap: wrap;
}
.table-toolbar__search { flex: 1 1 260px; max-width: 360px; }
.table-toolbar__meta { font-size: var(--fs-sm); color: var(--ink-500); margin-left: auto; }

.table-wrap { overflow-x: auto; }

.data-table { width: 100%; min-width: 900px; border-collapse: collapse; font-size: var(--fs-md); }
.data-table th, .data-table td { padding: 10px var(--sp-3); text-align: left; vertical-align: top; white-space: nowrap; }
.data-table td.cell-ellipsis { max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
.data-table td.cell-ellipsis .cell-sub { overflow: hidden; text-overflow: ellipsis; }
.data-table td.cell-wrap { white-space: normal; min-width: 220px; }
.data-table thead th {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--surface-2);
  color: var(--ink-500);
  font-size: var(--fs-xs);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  border-bottom: 1px solid var(--line-200);
  white-space: nowrap;
}
.data-table tbody tr { border-bottom: 1px solid var(--line-100); }
.data-table tbody tr:hover { background: var(--brand-050); }
.data-table td.num, .data-table th.num { text-align: right; font-variant-numeric: tabular-nums; }
.data-table .cell-strong { font-weight: 600; color: var(--ink-900); }
.data-table th.col-actions, .data-table td.col-actions {
  position: sticky;
  right: 0;
  background: var(--surface);
  box-shadow: -10px 0 12px -12px rgba(17, 23, 26, 0.5);
}
.data-table thead th.col-actions { background: var(--surface-2); z-index: 3; }
.data-table tbody tr:hover td.col-actions { background: var(--brand-050); }
.data-table .cell-sub { font-size: var(--fs-xs); color: var(--ink-500); }

.th-sort {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: none;
  border: 0;
  padding: 0;
  font: inherit;
  color: inherit;
  text-transform: inherit;
  letter-spacing: inherit;
  cursor: pointer;
}
.th-sort__arrow { opacity: 0.35; font-size: 10px; }
.th-sort[data-dir="asc"] .th-sort__arrow, .th-sort[data-dir="desc"] .th-sort__arrow { opacity: 1; color: var(--brand-500); }

.table-empty { padding: var(--sp-10); text-align: center; color: var(--ink-500); display: grid; gap: var(--sp-2); }

.table-footer {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-5);
  border-top: 1px solid var(--line-100);
  font-size: var(--fs-sm);
  color: var(--ink-500);
  flex-wrap: wrap;
}
.table-footer__pager { margin-left: auto; display: flex; gap: var(--sp-2); align-items: center; }

/* ---------- Badges ---------- */

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: var(--radius-pill);
  font-size: var(--fs-xs);
  font-weight: 600;
  white-space: nowrap;
  background: var(--line-100);
  color: var(--ink-600);
}
.badge[data-tone="ok"] { background: var(--ok-100); color: var(--ok-600); }
.badge[data-tone="warn"] { background: var(--warn-100); color: var(--warn-600); }
.badge[data-tone="danger"] { background: var(--danger-100); color: var(--danger-600); }
.badge[data-tone="info"] { background: var(--info-100); color: var(--info-600); }
.badge[data-tone="brand"] { background: var(--brand-100); color: var(--brand-600); }

.meter { display: grid; gap: 3px; min-width: 120px; }
.meter__track { height: 5px; border-radius: var(--radius-pill); background: var(--line-100); overflow: hidden; }
.meter__fill { height: 100%; background: var(--brand-500); border-radius: inherit; }
.meter__fill[data-tone="warn"] { background: var(--warn-600); }
.meter__fill[data-tone="danger"] { background: var(--danger-600); }

/* ---------- Formulaires ---------- */

.field { display: grid; gap: var(--sp-1); min-width: 0; }
.field__label { font-size: var(--fs-xs); font-weight: 600; color: var(--ink-500); text-transform: uppercase; letter-spacing: 0.04em; }
.field__hint { font-size: var(--fs-xs); color: var(--ink-500); }
.field--compact .field__label { text-transform: none; letter-spacing: 0; }

.input, textarea.input, select.input {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--line-200);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--ink-800);
  font-size: var(--fs-md);
}
.input:focus { border-color: var(--brand-500); }
textarea.input { resize: vertical; min-height: 68px; }

.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: var(--sp-4); }
.form-section { display: grid; gap: var(--sp-3); }
.form-section__title { font-size: var(--fs-sm); font-weight: 600; color: var(--ink-600); }

/* Lignes de document */
.lines { display: grid; gap: var(--sp-2); }
.line-row {
  display: grid;
  grid-template-columns: minmax(200px, 3fr) 90px 110px 110px 110px 34px;
  gap: var(--sp-2);
  align-items: end;
  padding: var(--sp-3);
  border: 1px solid var(--line-200);
  border-radius: var(--radius-md);
  background: var(--surface-2);
}
.line-row__total { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; padding-bottom: 9px; }
@media (max-width: 860px) {
  .line-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .line-row__total { text-align: left; }
}

.totals {
  display: grid;
  gap: 6px;
  justify-items: end;
  padding: var(--sp-4);
  border-radius: var(--radius-md);
  background: var(--brand-050);
  border: 1px solid var(--line-200);
}
.totals__row { display: flex; gap: var(--sp-6); font-size: var(--fs-md); color: var(--ink-600); }
.totals__row strong { font-variant-numeric: tabular-nums; color: var(--ink-900); min-width: 120px; text-align: right; }
.totals__row--main { font-size: var(--fs-lg); font-weight: 700; }

/* ---------- Modale ---------- */

.modal-host {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: grid;
  place-items: center;
  padding: var(--sp-4);
  background: rgba(17, 23, 26, 0.45);
  overflow-y: auto;
}
.modal {
  width: min(860px, 100%);
  max-height: min(88vh, calc(100vh - 2 * var(--sp-4)));
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
}
.modal--wide { width: min(1080px, 100%); }
.modal__header {
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  padding: var(--sp-4) var(--sp-5);
  border-bottom: 1px solid var(--line-100);
}
.modal__title { font-size: var(--fs-lg); font-weight: 600; }

}
.topbar__subtitle { font-size: 15px; color: var(--ink-600); }
.content { padding: 24px 28px 64px; gap: 22px; }

/* ---------- Boutons ---------- */
.btn { border-radius: 9px; border-width: 1.5px; font-weight: 600; background: var(--accent-fill); color: var(--on-accent); }
.btn:hover { background: var(--accent-fill); filter: brightness(1.1); }
.btn--secondary, .btn--ghost { background: var(--surface); color: var(--ink-800); border-color: var(--line-300); }
.btn--secondary:hover, .btn--ghost:hover { background: var(--surface); color: var(--accent); border-color: var(--accent); filter: none; }
.btn--danger { background: var(--danger-600); }
.icon-btn { border-radius: 7px; border-color: transparent; background: transparent; color: var(--ink-400); }
.icon-btn:hover { background: var(--surface); color: var(--accent); border-color: var(--line-300); }

/* ---------- Cartes et titres de section ---------- */
.card { border-radius: var(--radius-lg); box-shadow: none; }
.card__header { border-bottom: 1px solid var(--accent); padding: 14px 20px 10px; }
.card__title {
  font-family: var(--font-display); font-size: 24px; font-weight: 700; line-height: 1.05;
  text-transform: uppercase; letter-spacing: 0.03em; color: var(--accent);
  display: flex; align-items: center; gap: 10px;
}
.card__header .card__title::before { content: ""; width: 10px; height: 10px; background: currentColor; flex: none; }
.card__hint { font-size: 14px; color: var(--ink-500); }

/* ---------- Indicateurs (KPI) ---------- */
.kpi-grid { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.kpi {
  border-radius: 10px; border-left: 4px solid var(--accent-fill); box-shadow: none; padding: 12px 16px;
}
.kpi__label { font-size: 11.5px; letter-spacing: 0.07em; color: var(--ink-400); font-weight: 600; }
.kpi__value {
  font-family: var(--font-display); font-size: 34px; font-weight: 600; line-height: 1.05;
  letter-spacing: 0; color: var(--ink-900);
}
.kpi__hint { font-size: 13px; }
.kpi[data-tone="ok"] { border-left-color: var(--ok-600); }
.kpi[data-tone="warn"] { border-left-color: var(--warn-600); }
.kpi[data-tone="danger"] { border-left-color: var(--danger-600); }

/* ---------- Puces / onglets de filtre ---------- */
.chips { gap: 5px; }
.chip {
  font-family: var(--font-mono); font-size: 12.5px; padding: 3px 11px;
  border: 1.5px solid var(--line-300); background: var(--surface); color: var(--ink-600);
}
.chip:hover { background: var(--surface); border-color: var(--accent); color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--ink-900); border-color: var(--ink-900); color: var(--canvas); font-weight: 600; }

/* ---------- Tableaux ---------- */
.table-toolbar { border-bottom-color: var(--line-200); }
.table-toolbar__meta { font-family: var(--font-mono); font-size: 12px; }
.data-table thead th {
  background: var(--accent-fill); color: var(--on-accent); border-bottom: 0;
  font-family: var(--font-display); font-size: 15.5px; font-weight: 600; letter-spacing: 0.05em; padding: 9px 12px;
}
.data-table thead th.col-actions { background: var(--accent-fill); }
.th-sort__arrow { opacity: 0.55; }
.th-sort[data-dir="asc"] .th-sort__arrow, .th-sort[data-dir="desc"] .th-sort__arrow { color: var(--on-accent); }
.data-table tbody tr { border-bottom-color: var(--line-200); }
.data-table tbody tr:hover, .data-table tbody tr:hover td.col-actions { background: var(--surface-2); }
.data-table td:first-child .cell-strong { font-family: var(--font-mono); font-size: 13.5px; font-weight: 600; }
.data-table td.num { font-variant-numeric: tabular-nums; }
.table-footer { font-family: var(--font-mono); font-size: 12px; }

/* ---------- Badges ---------- */
.badge { border-radius: 4px; font-family: var(--font-mono); font-size: 11px; padding: 2px 7px; }

/* ---------- Formulaires ---------- */
.input, textarea.input, select.input { border: 1.5px solid var(--line-300); border-radius: 9px; }
.input:focus { border-color: var(--accent); outline: none; }
.field__label { color: var(--ink-400); letter-spacing: 0.07em; }
.form-section__title {
  font-family: var(--font-display); font-size: 18px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-600);
  padding-bottom: 4px; border-bottom: 2px solid var(--line-200);
}
.line-row { background: var(--surface); }
.totals { background: var(--surface-2); }
.totals__row--main strong { font-family: var(--font-display); font-size: 22px; }

/* ---------- Modales, notifications ---------- */
.modal { border-top: 3px solid var(--accent-fill); }
.modal__title { font-family: var(--font-display); font-size: 24px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; }
.modal-host { background: rgba(20, 20, 25, 0.5); }
.toast { border-radius: 9px; }

/* ---------- Accueil, fiches ---------- */
.home-hero { box-shadow: none; border-left: 4px solid var(--accent-fill); }
.home-hero__name, .profile__name { font-family: var(--font-display); font-size: 30px; text-transform: uppercase; letter-spacing: 0.02em; line-height: 1; }
.home-hero__avatar, .profile__avatar { font-family: var(--font-display); }

/* ---------- Graphiques ---------- */
.bars__bar:hover, .bars__bar:focus-visible { background: var(--brand-400); }
.bars__label, .bars__value { font-family: var(--font-mono); }

/* ---------- Connexion ---------- */
.login__brand { line-height: 1; font-family: var(--font-display); font-size: 40px; text-transform: uppercase; letter-spacing: 0.02em; color: var(--accent); }
.login__title { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.03em; }

/* ---------- Mobile ---------- */
@media (max-width: 1024px) {
  .topbar { padding: 14px 16px 10px; align-items: center; }
  .content { padding: 16px 16px 56px; }
  .topbar__burger { border-color: var(--line-300); color: var(--ink-800); }
}
@media (max-width: 720px) {

  <script>
    (function () {
      var main = document.getElementById('contenu');
      function explain(title, lines) {
        var card = document.createElement('div');
        card.className = 'card';
        var body = document.createElement('div');
        body.className = 'card__body';
        var h = document.createElement('h2');
        h.className = 'card__title';
        h.textContent = title;
        body.appendChild(h);
        lines.forEach(function (line) {
          var p = document.createElement('p');
          p.textContent = line;
          body.appendChild(p);
        });
        card.appendChild(body);
        main.innerHTML = '';
        main.appendChild(card);
        document.getElementById('pageTitle').textContent = 'Atelier Pilotage';
      }
      if (window.location.protocol === 'file:' && !window.__atelierSingleFile) {
        explain('Ouverture directe du fichier impossible', [
          'Le fichier index.html a ete ouvert depuis le disque (adresse commencant par file://). Les navigateurs bloquent alors le chargement des modules JavaScript et des donnees.',

        ]);
        return;
      }
      window.setTimeout(function () {
        if (window.__atelierBooted) return;
        explain('L application n a pas demarre', [
          'Le script principal (assets/js/main.js) n a pas pu etre execute apres 8 secondes.',
          'Verifiez dans la console du navigateur (touche F12, onglet Console) le message d erreur : fichier introuvable (404), type MIME incorrect pour les fichiers .js, ou navigateur trop ancien (Chrome, Edge, Firefox ou Safari recents requis).',
          'Verifiez aussi que le dossier assets/ a bien ete copie en entier avec index.html.'
        ]);
      }, 8000);
    })();
